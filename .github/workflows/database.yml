name: Database and entitlement gates
on: [push, pull_request, workflow_dispatch]
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: exam_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: exam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Native PostgreSQL integration and concurrent connections
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://exam_test:disposable_test_only@127.0.0.1:5432/exam_test
          ALLOW_EMPTY_TEST_DATABASE: 'yes'
